  prob:"군 \\(G\\)와 임의의 첨자집합 \\(I\\,(I\\neq\\emptyset)\\), 각 \\(i\\in I\\)에 대하여 \\(H_i\\)를 \\(G\\)의 부분군이라 하자. \\(H=\\bigcap_{i\\in I}H_i\\)라 할 때, \\(H\\)가 \\(G\\)의 부분군임을 보이시오.",

    {t:"결론",

    {w:true, t:"교수님 첨삭: \\(\\forall i\\in I\\) 를 각 단계마다 명시 — 빠뜨리면 감점 (2023 답안 지적)"}

// ────────────────────────────────────────────
// #2 순환군 보조정리 세트

D.push({
  rank:2, title:"순환군 보조정리 세트",
  src:[["2025 Q6 (i~iii) [9점]","25"],["2024 Q4 (i~iv) [12점]","24"],["2023 Q7 [6점]","23"],["2022 Q8 [6점]","22"]],
  prob:"유한군 \\(G\\)는 \\(a\\)로 생성되는 위수가 \\(n\\)인 순환군이다.<br>(i) \\(n=\\min\\{k\\mid k\\text{는 정수},\\,k>0,\\,a^k=e\\}\\)임을 보이시오.<br>(ii) 정수 \\(s\\)에 대하여 \\(|\\langle a^s\\rangle|=\\dfrac{n}{\\gcd(n,s)}\\)임을 보이시오.<br>(iii) \\(G\\)의 부분군 \\(H\\), \\(K\\)에 대하여 \\(|H|=|K|\\)이면 \\(H=K\\)임을 보이시오. (2025 기준)",
  lemmas:[
    {
      id:"보조정리 1 (필기본 p.4/9)",
      title:"\\(G=\\langle a\\rangle\\)일 때 다음 세 조건은 동치",
      body:'<ul class="lemma-list"><li>(1) \\(|G|=\\infty\\)</li><li>(2) \\(a^m=e\\Leftrightarrow m=0\\)</li><li>(3) \\(a^i=a^j\\Leftrightarrow i=j\\)</li></ul><div class="lemma-proof"><p><span class="pt">증명 (2)⇒(3):</span> \\(a^i=a^j\\Leftrightarrow a^{i-j}=e\\overset{(2)}{\\Leftrightarrow}i-j=0\\Leftrightarrow i=j\\).</p><p><span class="pt">(3)⇒(1):</span> (3)이 성립하면 \\(i\\neq j\\Rightarrow a^i\\neq a^j\\). \\(\\mathbb{Z}\\)는 무한집합이므로 \\(G=\\langle a\\rangle=\\{a^n\\mid n\\in\\mathbb{Z}\\}\\)의 원소는 모두 서로 다른 무한히 많은 원소. 따라서 \\(|G|=\\infty\\).</p><p><span class="pt">(1)⇒(2):</span> 대우를 보인다. \\(a^m=e\\)인 \\(m\\neq 0\\)이 존재한다고 가정. \\(a^{-m}=(a^m)^{-1}=e\\)이므로 \\(m>0\\)으로 가정해도 된다. 임의의 \\(g\\in G=\\langle a\\rangle\\)에 대해 \\(g=a^k\\)인 정수 \\(k\\)가 존재. 나눗셈 알고리즘에 의해 \\(k=qm+r\\,(0\\leq r&lt;m)\\)이면 \\(a^k=(a^m)^q\\cdot a^r=e\\cdot a^r=a^r\\). 따라서 \\(G\\subseteq\\{e,a,\\ldots,a^{m-1}\\}\\)이므로 \\(|G|\\leq m&lt;\\infty\\). 즉 (1)이 성립하지 않는다. \\(\\square\\)</p></div>'
    },
    {
      id:"보조정리 2 (필기본 p.4/9)",
      title:"\\(G=\\langle a\\rangle\\), \\(|G|&lt;\\infty\\)이면 \\(|G|=\\min\\{k\\in\\mathbb{Z}^+\\mid a^k=e\\}\\)",
      body:'<div class="lemma-proof"><p>\\(|G|&lt;\\infty\\)이므로 보조정리 1의 (1)이 성립하지 않고, 따라서 (2)도 성립하지 않는다. 즉 \\(a^m=e\\)인 \\(m\\neq 0\\)이 존재하며, \\(m>0\\)으로 가정해도 된다.</p><p>\\(m=\\min\\{k\\in\\mathbb{Z}^+\\mid a^k=e\\}\\)라 하자. 임의의 \\(g\\in G\\)에 대해 \\(g=a^n\\)이고 나눗셈 알고리즘에 의해 \\(n=mq+r\\,(0\\leq r&lt;m)\\)이면,<br>\\(g=a^n=a^{mq+r}=(a^m)^q\\cdot a^r=e\\cdot a^r=a^r\\).<br>따라서 \\(G=\\{a^0,a^1,\\ldots,a^{m-1}\\}\\)이고 \\(|G|=m\\)이다. \\(\\square\\)</p></div>'
    },
    {
      id:"보조정리 3 (필기본 p.4/9)",
      title:"\\(G=\\langle a\\rangle\\), \\(|G|=m&lt;\\infty\\)이면 \\(a^n=e\\Leftrightarrow m\\mid n\\)",
      body:'<div class="lemma-proof"><p><span class="pt">(⇒)</span> 나눗셈 알고리즘에 의해 \\(n=mq+r\\,(0\\leq r&lt;m)\\)이면,<br>\\(e=a^n=a^{mq+r}=(a^m)^q\\cdot a^r=e\\cdot a^r=a^r\\).<br>\\(m\\)의 최솟값에 의해 \\(r=0\\). \\(\\therefore m\\mid n\\).</p><p><span class="pt">(⇐)</span> \\(m\\mid n\\)이면 \\(n=mk\\)인 정수 \\(k\\)가 존재. \\(a^n=a^{mk}=(a^m)^k=e^k=e\\). \\(\\square\\)</p></div>'
    }
  ],
  steps:[
    {t:"(i) \\(n\\)이 최솟값임을 증명",
     b:"보조정리 2에 의해 \\(|G|=\\min\\{k\\in\\mathbb{Z}^+\\mid a^k=e\\}\\). \\(|G|=n\\)이므로 \\(n=\\min\\{k\\in\\mathbb{Z}^+\\mid a^k=e\\}\\). \\(\\square\\)"},
    {t:"(ii) \\(|\\langle a^s\\rangle|=n/\\gcd(n,s)\\) 증명 (필기본 정리 6.15)",
     b:"\\(b=a^s\\in G\\), \\(d=\\gcd(n,s)\\), \\(m=|\\langle b\\rangle|=\\min\\{k\\in\\mathbb{Z}^+\\mid b^k=e\\}\\)라 하자.<br>\\(n=n_1d\\), \\(s=s_1d\\), \\(\\gcd(n_1,s_1)=1\\)인 \\(n_1,s_1\\in\\mathbb{Z}\\)가 존재한다.<br><br><strong>①</strong> \\(b^{n_1}=(a^s)^{n_1}=(a^{s_1d})^{n_1}=(a^{n_1d})^{s_1}=(a^n)^{s_1}=e^{s_1}=e\\).<br>\\(m\\)의 최솟값에 의해 \\(m\\leq n_1\\).<br><br><strong>②</strong> \\(b^m=(a^s)^m=e\\)이므로 보조정리 3에 의해 \\(n\\mid sm\\).<br>\\(n_1d\\mid s_1dm\\Rightarrow n_1\\mid s_1m\\). \\(\\gcd(n_1,s_1)=1\\)이므로 \\(n_1\\mid m\\).<br><br>①②에 의해 \\(m=n_1=\\dfrac{n}{d}=\\dfrac{n}{\\gcd(n,s)}\\). 따라서 \\(|\\langle a^s\\rangle|=\\dfrac{n}{\\gcd(n,s)}\\). \\(\\square\\)"},

  ],
  keys:[
    "보조정리 1→2→3 순서로 증명, (i)은 보조정리 2를 인용",
    "(ii) ① 상계(\\(m\\leq n/d\\)) + ② 하계(\\(n/d\\leq m\\)) 양방향으로 \\(m=n/d\\) 확정",
    "2025: (i~iii), 2024: (i~iv 부분군 개수 포함) — 구별 필요",
    {w:true, t:"교수님 첨삭: (3)⇒(1)에서 '\\(\\mathbb{Z}\\)는 무한집합이므로' 근거 문장 필수 — 없으면 순환논리로 감점"}
  ]

D.push({
  rank:3, title:"순환군의 부분군은 순환군",
  src:[["2025 Q5 [3점]","25"],["2023 Q5 [4점]","23"],["2022 Q6 [3점]","22"],["2021 Q5(일부)","21"]],

  lemmas:[],
  steps:[
    {t:"설정",
     b:"\\(G=\\langle a\\rangle\\)을 순환군, \\(H\\leq G\\)를 부분군이라 하자."},
    {t:"경우 1: \\(H=\\{e\\}\\)",
     b:"\\(H=\\{e\\}=\\langle e\\rangle\\)이므로 자명한 순환군이다."},
    {t:"경우 2: \\(H\\neq\\{e\\}\\) — 최솟값 원소 선택",
     b:"\\(H\\neq\\{e\\}\\)이면 \\(e\\)가 아닌 원소가 존재. \\(\\forall x\\in H,\\,x\\neq e\\)에 대해 \\(\\exists k\\in\\mathbb{Z},\\,k\\neq 0\\)이고 \\(x=a^k\\)이다.<br>\\(a^{-k}=(a^k)^{-1}\\in H\\)이므로 양의 지수를 가진 원소가 존재한다.<br>\\(S=\\{k\\in\\mathbb{N}\\mid a^k\\in H\\}\\neq\\emptyset\\)이고, 정수의 정렬성에 의해 \\(S\\)는 가장 작은 원소를 가진다. 이를 \\(m\\)이라 하면 \\(\\langle a^m\\rangle\\supseteq\\{e\\}\\)이다. (정리 5.19)"},
    {t:"\\(H=\\langle a^m\\rangle\\) 증명",
     b:"<strong>(⊆, \\(\\langle a^m\\rangle\\subseteq H\\)):</strong> \\(a^m\\in H\\)이고 \\(H\\)는 군이므로 \\(\\langle a^m\\rangle\\subseteq H\\).<br><br><strong>(⊇, \\(H\\subseteq\\langle a^m\\rangle\\)):</strong> 임의의 \\(h\\in H\\)에 대해 \\(h=a^k\\)인 정수 \\(k\\)가 존재.<br>나눗셈 알고리즘에 의해 \\(k=mq+r\\,(0\\leq r&lt;m)\\)이면,<br>\\(a^r=a^{k-mq}=a^k\\cdot(a^m)^{-q}=h\\cdot(a^m)^{-q}\\in H\\).<br>\\(m\\)의 최솟값에 의해 \\(r=0\\). 따라서 \\(m\\mid k\\), 즉 \\(h=a^k=(a^m)^q\\in\\langle a^m\\rangle\\).<br><br>\\(H=\\langle a^m\\rangle\\)이므로 \\(H\\)는 순환군이다. \\(\\square\\)"}
