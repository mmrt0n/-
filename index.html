  steps:[

const TB=document.getElementById('TB'),WR=document.getElementById('WR');
const yrcls={'25':'chip25','24':'chip24','23':'chip23','22':'chip22','21':'chip21'};

D.forEach((p,i)=>{
  const btn=document.createElement('button');
  btn.className='tb'+(i===0?' on':'');
  btn.innerHTML=`<b>#${p.rank}</b>&nbsp;${p.title.split(' ')[0]}`;
  btn.onclick=()=>{
    document.querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));
    document.querySelectorAll('.pn').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    document.getElementById('p'+i).classList.add('on');
    renderMath();
  };
  TB.appendChild(btn);

  const pn=document.createElement('div');
  pn.className='pn'+(i===0?' on':'');
  pn.id='p'+i;

  const chips=p.src.map(([s,y])=>`<span class="chip ${yrcls[y]||'chip21'}">📌 ${s}</span>`).join('');
  const lemH=p.lemmas.map(l=>`<div class="lemma"><div class="ltitle">📗 ${l.id}: ${l.title}</div><div style="font-size:.88rem">${l.body}</div></div>`).join('');
  const stpH=p.steps.map((s,si)=>`<div class="step"><div class="sh"><span class="sn">${si+1}</span>${s.t}</div><div class="sb">${s.b}</div></div>${si<p.steps.length-1?'<hr class="s">':''}`).join('');
  const keyH=p.keys.map(k=>`<li>${k}</li>`).join('');

  pn.innerHTML=`
    <div class="rbadge">🏆 빈도 ${p.rank}위</div>
    <div class="chips">${chips}</div>
    <div class="card">
      <div class="ctitle">${p.title}</div>
      <div class="plabel">📝 문제 원문</div>
      <div class="pbox">${p.prob}</div>
      ${lemH?`<button class="tog" onclick="tog(this)">📗 보조정리 <span class="ti">▼</span></button><div class="tc"><div class="sbox">${lemH}</div></div>`:''}
      <button class="tog" onclick="tog(this)">✏️ 풀이 보기 <span class="ti">▼</span></button>
      <div class="tc"><div class="sbox">${stpH}</div></div>
      <button class="tog" onclick="tog(this)">⚑ 핵심 포인트 <span class="ti">▼</span></button>
      <div class="tc"><div class="kbox"><div class="ktitle">시험에서 놓치기 쉬운 포인트</div><ul class="kl">${keyH}</ul></div></div>
    </div>`;
  WR.appendChild(pn);
});
